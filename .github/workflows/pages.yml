name: pages

# Publishes site/ to GitHub Pages (remapd.gureet.ca) when it changes on main.
# Pull requests that touch the site only run the check.
# One-time setup, in the repository's Settings -> Pages: set Source to
# "GitHub Actions", then add the custom domain. See HANDOFF.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tools/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the site
        run: python3 tools/check_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
