name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test against a fake remote
        run: python3 daemon/test/run_tests.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build for Android (static ARM binaries)
        run: |
          pip install ziglang==0.17.0
          sh daemon/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remapd
          path: |
            daemon/remapd
            daemon/remapd-arm64
            daemon/examples/*.conf

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build remapd to go inside the app
        run: |
          pip install ziglang==0.17.0
          sh daemon/build.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the app
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease
      - name: Run the app's shell commands with mksh too (Android's shell)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mksh
          TEST_SH=mksh ./gradlew :app:testReleaseUnitTest --tests '*CommandsTest*' --rerun
      - name: Test the app's adb client against a fake adbd (JDK, then Conscrypt as on Android)
        run: |
          pip install pyopenssl==26.4.0 cryptography==50.0.1 adb-shell==0.4.4
          mkdir -p app/adbtest/build
          curl -sSfL -o app/adbtest/build/conscrypt.jar \
            https://repo1.maven.org/maven2/org/conscrypt/conscrypt-openjdk-uber/2.5.2/conscrypt-openjdk-uber-2.5.2.jar
          echo "eaf537d98e033d0f0451cd1b8cc74e02d7b55ec882da63c88060d806ba89c348  app/adbtest/build/conscrypt.jar" | sha256sum -c -
          CONSCRYPT_JAR=$PWD/app/adbtest/build/conscrypt.jar python3 app/adbtest/run_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: remapd-app
          path: app/build/outputs/apk/release/*.apk
