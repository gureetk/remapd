# remapd config for your Bluetooth remote (ACE666BT, 0508:0110).
# Button codes are the MSC_SCAN values from `getevent -l` (e.g. 000c001c).
#
# Android reads this remote with /vendor/usr/keylayout/Vendor_0508_Product_0110.kl,
# a file made for another remote with the same ID. It only knows the basic keys,
# so the TV and media keys reached apps as UNKNOWN. `send` fixes that.
#
#   send <code> <ANDROID_KEY>  Press this Android key when the button is pressed
#                              (KeyEvent.KEYCODE_* names without the prefix, like
#                              PROG_RED, MEDIA_PLAY_PAUSE, PAGE_UP, GUIDE).
#                              remapd presses it on a virtual remote that Android
#                              reads with its standard key layout. Holding the
#                              button holds the key. The button's own key is off.
#   launch <code> <package>    Open an app when the button is pressed.
#   run <code> <command>       Run a shell command when the button is pressed.
#   map <code> <KEY_NAME>      Make the kernel report the button as another Linux
#                              key (only helps when Android reads the remote with
#                              its standard key layout, which yours doesn't).
#   device <text>              Only change devices whose name contains <text>, or
#                              whose vendor:product is <text> (see `remapd list`).
#
# Try changes with:    /data/local/tmp/remapd run /data/local/tmp/remapd.conf
# Then keep them with: /data/local/tmp/remapd start /data/local/tmp/remapd.conf

device ACE666BT

# --- Colour buttons ---
send 000c0069 PROG_RED
send 000c006a PROG_GREEN
send 000c006c PROG_YELLOW
send 000c006b PROG_BLUE

# --- Media and sound (these didn't work at all before) ---
send 000c00cd MEDIA_PLAY_PAUSE
send 000c00b2 MEDIA_RECORD
send 000c00e2 VOLUME_MUTE

# --- TV buttons ---
send 000c004b CHANNEL_UP         # Pg/Ch Up   (PAGE_UP for page keys instead)
send 000c004e CHANNEL_DOWN       # Pg/Ch Down (PAGE_DOWN for page keys instead)
send 000c001c GUIDE              # Guide
send 000c0083 LAST_CHANNEL       # the second Back button: back to the last channel
send 000c0060 INFO               # Info (sent with input keyevent: Android's standard
                                 #   key layout has no line for INFO)
send 000c021f SEARCH             # Search

# --- App and settings buttons ---
launch 000c0058 com.google.android.youtube.tv          # YouTube
run    000c0004 am start -a android.settings.SETTINGS  # Settings
launch 000c0008 org.jellyfin.androidtv                 # IPTV Player: Jellyfin
#launch 000c0003 some.app.package                      # Favourite: not set yet (any app, or send/run anything)

# --- Turned off ---
map    000c0221 KEY_UNKNOWN      # Google Assistant: does nothing
                                 # (replace with a launch, run or send line to give it a job)
